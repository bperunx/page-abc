name: Task
description: Standard-Ticket mit Zusammenfassung und Acceptance Criteria
# Issue Type (Org-weit, genau einer pro Issue):
#   Task    – konkretes Arbeitspaket
#   Bug     – unerwartetes Fehlverhalten
#   Feature – neue Funktionalität, Idee, Anfrage
# Aktuelle Liste: gh api orgs/leebmann24/issue-types --jq '.[].name'
type: Task
# Labels (Repo leebmann24/platform, beliebig viele, zusätzlich zum Type):
#   Bereich:   l24-ai, ai-service, chat-service, support-service, etc
#   Sonstiges: docs, help wanted, duplicate, invalid, wontfix, etc
#   (bug/enhancement nicht nutzen, das deckt der Type ab)
# Aktuelle Liste: gh label list -R leebmann24/platform
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Zusammenfassung
      description: Worum geht es, in zwei bis drei Sätzen? Was soll gemacht werden und warum?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Wann ist das Ticket fertig? Jede Zeile mit Ja oder Nein prüfbar; wo nicht offensichtlich, den Prüfweg dazuschreiben.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Hinweise
      description: Optional. Betroffene Module, Abhängigkeiten, verwandte Issues, was nicht dazugehört.
    validations:
      required: false
