name: Task
description: Standard-Ticket mit Kurzzusammenfassung und Acceptance Criteria
# Issue Type (Org-weit, genau einer pro Issue):
#   Task    – konkretes Arbeitspaket
#   Bug     – unerwartetes Fehlverhalten
#   Feature – neue Funktionalität, Idee, Anfrage
# Aktuelle Liste: gh api orgs/leebmann24/issue-types --jq '.[].name'
type: Task
# Labels (Repo leebmann24/platform, beliebig viele, zusätzlich zum Type):
#   Bereich:   l24-ai, ai-service, chat-service, support-service, etc
#   Sonstiges: docs, help wanted, duplicate, invalid, wontfix, etc
#   (bug/enhancement nicht nutzen, das deckt der Type ab)
# Aktuelle Liste: gh label list -R leebmann24/platform
labels: []
body:
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: |
        - **Kurzzusammenfassung:** Worum geht es, in zwei bis drei Sätzen? Was soll gemacht werden und warum?
        - **Acceptance Criteria:** Wann ist das Ticket fertig? Jede Zeile mit Ja oder Nein prüfbar; wo nicht offensichtlich, den Prüfweg dazuschreiben.
        - **Hinweise:** Optional. Betroffene Module, Abhängigkeiten, verwandte Issues, was nicht dazugehört.
      value: |
        ## Kurzzusammenfassung


        ## Acceptance Criteria

        - [ ]
        - [ ]

        ## Hinweise

    validations:
      required: true
